name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      PORTFOLIO_FIXTURE: ${{ github.workspace }}/holdings-live.tsv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public IntelInvest JSON API, pagination and allocations
        run: node tools/smoke-public-api.cjs
      - name: Inspect and prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then "$SDKM" --install 'platforms;android-35'; fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then "$SDKM" --install 'build-tools;35.0.0'; fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run Kotlin gain and formatting tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify Android launcher app label and icon
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/portfolio_badging.txt
          grep -F "application-label:'Portfolio Watch'" /tmp/portfolio_badging.txt
          grep -F "application-icon-" /tmp/portfolio_badging.txt
          echo "Launcher label and icon are present"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: IntelInvest-Portfolio-Watch-v0.5.1-Holdings-Fix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
